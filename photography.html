<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Photography — Ethan Soh</title>
  <meta name="description" content="Concert, travel, and everyday photography by Ethan Soh." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,12 92,86 8,86' fill='%23f5f5f7'/></svg>" />
  <link rel="stylesheet" href="style.css?v=19" />
  <link rel="stylesheet" href="photography.css?v=4" />
</head>
<body>
  <main>
    <header class="photo-header">
      <div class="container">
        <a class="photo-back" href="about.html">← Back to about</a>
        <div class="photo-intro">
          <h1>Photography.</h1>
          <p>Concerts taught me to look for moments. Then I started noticing the light everywhere else too.</p>
        </div>
      </div>
    </header>

    <section class="photo-collection" aria-label="Photographs by Ethan Soh">
      <div class="container photo-grid">
        <figure class="photo-main">
          <img src="about-assets/concert-blue.jpg" width="4000" height="3000" alt="A singer performing beneath blue stage lights" />
        </figure>
        <figure class="photo-tall">
          <img src="about-assets/concert-spotlight.jpeg" width="1440" height="1975" alt="A singer standing in a spotlight during a concert" loading="lazy" />
        </figure>
        <figure class="photo-wide">
          <img src="about-assets/concert-wide-white.jpg" width="4000" height="2252" alt="A wide concert stage framed by beams of white light and the crowd" loading="lazy" />
        </figure>
        <figure class="photo-stage">
          <img src="about-assets/concert-wide-purple.jpg" width="4000" height="3000" alt="Performers silhouetted beneath purple stage lights" loading="lazy" />
        </figure>
        <figure class="photo-reflection">
          <img src="about-assets/night-reflection.jpg" width="4000" height="3000" alt="A lit stone wall reflected in still water at night" loading="lazy" />
        </figure>
        <figure class="photo-pavilion">
          <img src="about-assets/night-pavilion.jpg" width="4000" height="3000" alt="A warmly lit pavilion photographed from below at night" loading="lazy" />
        </figure>
        <figure class="photo-architecture">
          <img src="about-assets/blue-architecture.jpg" width="3000" height="4000" alt="An apartment block silhouetted against a deep blue evening sky" loading="lazy" />
        </figure>
        <figure class="photo-sunset">
          <img src="about-assets/sunset-hdb.jpg" width="4000" height="3000" alt="A vivid sunset breaking through clouds above apartment blocks" loading="lazy" />
        </figure>
        <figure class="photo-marina">
          <img src="about-assets/marina-bay-storm.jpg" width="4000" height="3000" alt="Marina Bay Sands beneath a dark stormy sky, with Singapore flags in the foreground" loading="lazy" />
        </figure>
        <figure class="photo-exhibit">
          <img src="about-assets/newater-exhibit.jpg" width="4000" height="3000" alt="A speaker framed by glowing blue exhibits at the NEWater Visitor Centre" loading="lazy" />
        </figure>
        <figure class="photo-greenery">
          <img src="about-assets/indoor-greenery.jpg" width="3000" height="4000" alt="Dense indoor greenery reflected in a dark pool" loading="lazy" />
        </figure>
        <figure class="photo-mountain">
          <img src="about-assets/mountain-overlook.jpg" width="4000" height="3000" alt="A quiet mountain overlook with a person standing near the edge" loading="lazy" />
        </figure>
        <figure class="photo-dusk">
          <img src="about-assets/mountain-dusk.jpg" width="4000" height="3000" alt="Layered mountain ridges beneath a warm dusk sky" loading="lazy" />
        </figure>
        <figure class="photo-rays">
          <img src="about-assets/concert-light-rays.jpg" width="4000" height="3000" alt="Concert spotlights casting long beams over a stage" loading="lazy" />
        </figure>
        <figure class="photo-concert-wide-new">
          <img src="about-assets/concert-blue-wide.jpg" width="4000" height="3000" alt="A wide concert stage washed in blue light" loading="lazy" />
        </figure>
        <figure class="photo-flight">
          <img src="about-assets/airplane-sunrise.jpg" width="4000" height="3000" alt="The first edge of sunrise seen through an aeroplane window" loading="lazy" />
        </figure>
        <figure class="photo-red-sun">
          <img src="about-assets/red-sun-haze.jpg" width="4000" height="3000" alt="A red sun suspended in haze between two streetlights" loading="lazy" />
        </figure>
        <figure class="photo-alpaca">
          <img src="about-assets/alpaca.jpg" width="4000" height="3000" alt="An alpaca looking into the camera with Ethan behind it" loading="lazy" />
        </figure>
      </div>
    </section>
  </main>

  <footer class="photo-footer">
    <div class="container">
      <a href="about.html">Back to about <span>›</span></a>
    </div>
  </footer>
</body>
</html>
